extend type Product {
  """Selling unit for the price: m, kg, g, lb, oz, or piece."""
  saleUnit: String
  """Minimum quantity a shopper can order, in `saleUnit`."""
  moq: Int
  """Added to each unit when a shopper prints a design on this fabric."""
  printFee: Float
  """Price of one 20×20 cm test swatch. Blank follows 40% of the product price."""
  priceTestSwatch: Float
  """Price of one 75×100 cm big swatch. Blank follows 80% of the product price."""
  priceBigSwatch: Float
}

extend type OrderItem {
  saleUnit: String
  moq: Int
  updateSaleApi: String!
}
