type FabricShipCountry {
  countryCode: String!
  countryName: String!
  zone: Int!
}

type FabricShipRate {
  band: String!
  weightKg: Float!
  zone: Int!
  amountInr: Float!
}

type FabricLocalShipRate {
  service: String!
  band: String!
  weightKg: Float!
  amountInr: Float!
}

extend type Query {
  fabricShipCountries: [FabricShipCountry!]!
  fabricShipRates: [FabricShipRate!]!
  """Percent added to the card price at checkout. Shoppers see only the total."""
  fabricShipSurcharge: Float!
  """DTDC prices for addresses in India. Export rates are a separate list."""
  fabricLocalShipRates: [FabricLocalShipRate!]!
}

"""The zone, weight and rupee charge frozen when the order was placed."""
type FabricShipLock {
  """Empty on an India order. Export orders keep the zone from the card."""
  zone: Int
  """DTDC service on an India order. Empty on an export order."""
  service: String
  serviceName: String
  weightKg: Float!
  billedWeightKg: Float!
  amountInr: Float!
  """Empty on orders placed before the surcharge existed."""
  surchargePercent: Float
  chargedInr: Float
  exchangeRate: Float!
  currency: String!
  perKgRateInr: Float
  extraKg: Float
  charged: Float!
}

extend type Order {
  fabricShipLock: FabricShipLock
}
