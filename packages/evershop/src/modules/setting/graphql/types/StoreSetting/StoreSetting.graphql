extend type Setting {
  storeName: String
  storeDescription: String
  storeLanguage: String
  storeLanguages: [String]
  adminLanguage: String
  storeCurrency: String
  exchangeRateUsd: String
  exchangeRateEur: String
  exchangeRateAud: String
  exchangeRateGbp: String
  defaultExportMargin: String
  """Percent paid to designers when a design prints. Used when a designer has no own rate."""
  designerCommissionRate: String
  """Days after delivery before a designer commission becomes available for payout."""
  designerHoldDays: String
  """Minimum available balance, in rupees, before a designer can be paid out."""
  designerMinPayout: String
  storeTimeZone: String
  storePhoneNumber: String
  storeEmail: String
  storeCountry: String
  storeAddress: String
  storeCity: String
  storeProvince: String
  storePostalCode: String
}
